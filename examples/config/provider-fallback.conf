# Provider Fallback Configuration
# Location: ~/.lazypr
#
# Keep both API keys ready so you can switch execution providers without
# changing the model or generation settings.

GROQ_API_KEY=your-groq-api-key-here
CEREBRAS_API_KEY=your-cerebras-api-key-here

# Start with Groq and switch to Cerebras when a fallback is needed.
PROVIDER=groq

# The model is always Qwen 3.8 27B; lazypr selects the provider's API ID.
DEFAULT_BRANCH=main
FILTER_COMMITS=true
LOCALE=en
MAX_RETRIES=5
TIMEOUT=45000
CONTEXT=

# Switch provider:
#   lazypr config set PROVIDER=cerebras
#   lazypr config set PROVIDER=groq
#
# Inspect the active configuration:
#   lazypr config list
